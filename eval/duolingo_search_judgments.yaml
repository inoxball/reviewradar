      tägliche Einheit nicht schwer. Um die nervige Werbung abzustellen und bei Bedarf auch mal mehr üben zu können hab ich
      mir die Bezahlversion gegönnt. Allerdings nervt mich immernoch, dass ich immer Max gratis ausprobieren soll. Einmal
      hat mir gereicht. Das sind wirklich nur stumpfsinnige Dialoge, wobei der Bär auch noch über schlechte Aussprache verfügt.
      Mir fehlen bei den Übungen fast immer die Artikel, die steigende Schwierigkeit, v.a. bei den Dialogen. Wenn man nur
      zum Sprechen lernen eine App sucht, ist Duolingo (noch) nicht geeignet genug. Zu wenig und zu einfache Sprechübungen,
      zu viel Korrekturen bei der Schreibweise.
