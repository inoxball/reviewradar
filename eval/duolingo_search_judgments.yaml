    text: 学習アプリなのに学習をさせてくれないのはおかしい 今700日弱ほどこのアプリを利用している受験生です。 皆さんが酷評しているアプリの見た目などは、ずっとやっていると何度も変わって慣れるので個人的には気になりません。あと、このアプリを利用してきたおかげで、学校の定期テストなどでも良い結果を残せてきました。ただ、一年ほど前に、体力のシステムが、ハート5個でミスをしたら1個減るという「間違えなければいくらでもレッスンができる」仕組みが、エナジー？(⚡️みたいな)というミスをしようが正解しようが体力が減っていく仕組みに変わりました。そして、このアプリにあるリーグで一位になろうとやる気になって勉強しようとしても、全問正解しようと減っていくので一位になんてなれるわけがありません。運営が課金モードを推奨したいのはわかっているのですが、それが見え見えになってきているし、学びたいユーザーがいるのに学習ができないのは、学習アプリとしておかしいし、本末転倒なのでは？同級生にもこのアプリを使っている人は何人もいますが、私のような学生はお金をアプリにつかえる人は少ないし軽い気持ちで始めた人にも厳しいです。ユーザーの年齢層や始めたばかりの人のことも考えてシステムをつくってほしいです。
