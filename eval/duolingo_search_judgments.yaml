    text: AI ruined it I used to love learning with this app. Now I feel like I cant as now they use AI, and I do not trust
      any of the information to be correct as AI is, despite the name, not intelligent. Now I just do lessons on my native
      language so I don't lose my over 400 day streak. Thanks a lot, you ruined a great tool for learning. If my streak werent
      so big I would uninstall the app. AI is ruining our world.
  - store: app_store
    id: '14540002405'
    grade: 2
    text: AI Fizzles & Frustrates To let you know I’ve been at this awhile and seen a lot of change… I first heard about this
      App at a TEDx Conference years ago and loved the concept along with a simple “captcha” technology used to translate
      written text and make it accessible in many languages online. I’m hoping that the game streaks and competition have
      NOT taken precedence over being able to read, write, hear, and speak a given language well. Before all the AI seemed
      to take over, the App seemed more consistent. As I continue to find inconsistencies that persist, the learning experience
      has grown frustrating and I’m starting to wonder, “Am I really speaking Spanish with anything close to 90+% accuracy
      the App suggests?” Although difficult to capture all the issues when you’re running through a timed lesson and focusing
      on learning, following are some of the issues I’ve experienced a lot, so they’re in my memory. Hope you’ll consider
      fixing them and continue to stay on top of any new ones. Flashcard lessons seem to randomly require “el” or “la” before
      a term that doesn’t start with “the” in English. Also, “finally” randomly requires “al fin” response and accepts nothing
      else. Falstaff still periodically uses an American accent in video calls when he’s speaking Spanish. More sentence responses
      in Spanish are being counted as errors when a different verb that means the same thing in English is used. Most frustrating
      are that NOT all mistakes are explained, so we can understand how to speak the language better. One improvement that
      stands out is that sentences with “you” in English are no longer counted as errors if usted, ustedes, or tu are used
      as long as they’re with the correct verb forms and sentence structure.
