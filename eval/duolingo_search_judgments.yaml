    text: サブスク期限の通知なんて来ない 追記です。期限前に通知が来るから大丈夫！なんで試さないの？みたいな広告が延々と繰り返されるけど、あと2日無料で使えるよ！っていうプッシュ通知が1回来るだけなので、大量の通知に紛れて簡単に見落とします。ほかのサービスはちゃんとメールで届きます。あんなの通知とは言えない。いきなりAppleから1年のサブスク引き落としのメールが来て最悪でした。詐欺にあった気分。
      たまにリマインダーのメッセージが攻撃的すぎて不愉快。最近はアイコンが変な顔で気持ち悪い。これも不愉快。クセが強すぎる。 ちょっと気だるそうなキャラの声の人とか、初学者に不適切な音声は使わないでほしい。またどうしても音声が認識されない単語があるが、何が違うのかわからないので改善できない。
      ミャオンとか変な名前の人の発音を何回も練習させられたり、おかしな例文があったり、実用的でないところが残念です。もっと一般的な名前のほうが有用性高いですよね。 また、これいくら？とかトイレはどこですか？など、旅行で使うような基本的なフレーズがいつまでも出てこない。
      また一度認識されて青くなった単語の色が戻ったりするのも意味がわかりません。 あと数字はまとめて覚えたい。バラバラ出てきても規則性がないのでいつまでも覚えられない。
