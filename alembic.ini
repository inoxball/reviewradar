# Alembic CLI configuration. The application itself uses `reviewradar db upgrade`,
# which locates the bundled migrations without this file.
#
# The database URL is resolved from REVIEWRADAR_DATABASE_URL (see env.py).

[alembic]
script_location = %(here)s/src/reviewradar/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
